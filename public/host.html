<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CamShare · Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Barlow+Condensed:wght@300;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c0f;
    --surface: #0d1318;
    --border: #1a2530;
    --border-bright: #233040;
    --green: #00e5a0;
    --green-dim: rgba(0,229,160,0.15);
    --amber: #ffb020;
    --red: #ff4545;
    --text: #c8d8e8;
    --text-dim: #5a7080;
    --text-faint: #2a3a48;
    --mono: 'Space Mono', monospace;
    --display: 'Barlow Condensed', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px);
    pointer-events: none; z-index: 100;
  }
  .layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: auto 1fr;
    min-height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px;
    gap: 24px;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: contents; }
  }

  /* ─── Topbar ──────────────────────────────────────────────── */
  .topbar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 20px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .back-btn {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-decoration: none;
    border: 1px solid var(--border-bright);
    padding: 6px 12px;
    transition: border-color 0.15s, color 0.15s;
  }
  .back-btn:hover { border-color: var(--green); color: var(--green); }
  .logo {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: 0.06em;
    color: #fff;
  }
  .logo span { color: var(--green); }
  .mode-badge {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    padding: 4px 10px;
    border: 1px solid var(--green);
    color: var(--green);
    text-transform: uppercase;
  }
  .spacer { flex: 1; }
  .peer-count {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }
  .peer-count strong { color: var(--green); }

  /* ─── Main video ──────────────────────────────────────────── */
  .main-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .video-container {
    position: relative;
    background: #000;
    border: 1px solid var(--border);
    aspect-ratio: 16/9;
    overflow: hidden;
  }
  #local-video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1); /* Mirror for host preview */
  }
  .video-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(8,12,15,0.9);
    transition: opacity 0.3s;
  }
  .video-overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-icon { font-size: 3rem; }
  .overlay-text {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  /* REC indicator */
  .rec-badge {
    position: absolute;
    top: 16px; left: 16px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.7);
    padding: 6px 12px;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--red);
    border: 1px solid rgba(255,69,69,0.3);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .rec-badge.active { opacity: 1; }
  .rec-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--red);
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* Viewer badges */
  .viewer-badges {
    position: absolute;
    top: 16px; right: 16px;
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
  }
  .viewer-badge {
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--border-bright);
    font-size: 0.58rem;
    padding: 4px 8px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
  }
  .stat {
    background: var(--surface);
    flex: 1;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .stat-label {
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    color: var(--text-faint);
    text-transform: uppercase;
  }
  .stat-val {
    font-size: 0.78rem;
    color: var(--green);
    font-weight: 700;
  }

  /* ─── Sidebar ─────────────────────────────────────────────── */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-body { padding: 16px; }

  /* Room setup */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .field input, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border-bright);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus { border-color: var(--green); }
  .field select option { background: var(--bg); }

  .btn {
    width: 100%;
    padding: 13px;
    font-family: var(--display);
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--green); color: #000; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Log */
  #log {
    list-style: none;
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  #log li {
    font-size: 0.62rem;
    line-height: 1.5;
    color: var(--text-dim);
    padding: 4px 0;
    border-bottom: 1px solid var(--text-faint);
    letter-spacing: 0.04em;
  }
  #log li.ok { color: var(--green); }
  #log li.warn { color: var(--amber); }
  #log li.err { color: var(--red); }

  /* Room ID display */
  .room-id-display {
    background: var(--bg);
    border: 1px solid var(--green);
    padding: 12px;
    text-align: center;
    margin-bottom: 16px;
  }
  .room-id-display .label {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .room-id-display .value {
    font-size: 1.1rem;
    color: var(--green);
    letter-spacing: 0.1em;
  }

  /* QR placeholder */
  .share-url {
    font-size: 0.6rem;
    color: var(--text-faint);
    word-break: break-all;
    line-height: 1.6;
    letter-spacing: 0.03em;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    cursor: text;
    user-select: all;
  }
</style>
</head>
<body>
<div class="layout">
  <!-- Topbar -->
  <div class="topbar">
    <a href="/" class="back-btn">← BACK</a>
    <div class="logo">CAM<span>SHARE</span></div>
    <div class="mode-badge">HOST MODE</div>
    <div class="spacer"></div>
    <div class="peer-count">VIEWERS: <strong id="viewer-count">0</strong></div>
  </div>

  <!-- Main -->
  <div class="main-panel">
    <div class="video-container">
      <video id="local-video" autoplay muted playsinline></video>
      <div class="video-overlay" id="video-overlay">
        <div class="overlay-icon">📷</div>
        <div class="overlay-text">SELECT A CAMERA TO BEGIN</div>
      </div>
      <div class="rec-badge" id="rec-badge">
        <div class="rec-dot"></div>
        LIVE
      </div>
      <div class="viewer-badges" id="viewer-badges"></div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-label">Resolution</div>
        <div class="stat-val" id="stat-res">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Frame Rate</div>
        <div class="stat-val" id="stat-fps">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Room</div>
        <div class="stat-val" id="stat-room">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Status</div>
        <div class="stat-val" id="stat-status">IDLE</div>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Camera Setup -->
    <div class="panel">
      <div class="panel-header">⚙ Camera Setup</div>
      <div class="panel-body">
        <div class="field">
          <label>Camera Device</label>
          <select id="cam-select"><option value="">Loading cameras...</option></select>
        </div>
        <div class="field">
          <label>Quality</label>
          <select id="quality-select">
            <option value="1280x720">1280×720 (HD)</option>
            <option value="1920x1080">1920×1080 (Full HD)</option>
            <option value="640x480">640×480 (SD)</option>
          </select>
        </div>
        <div class="field">
          <label>Room Name</label>
          <input id="room-input" type="text" placeholder="e.g. desk-cam" maxlength="32">
        </div>
        <button class="btn btn-primary" id="start-btn">START HOSTING</button>
      </div>
    </div>

    <!-- Active room info (hidden until started) -->
    <div class="panel" id="room-info-panel" style="display:none">
      <div class="panel-header">📋 Room Info</div>
      <div class="panel-body">
        <div class="room-id-display">
          <div class="label">ROOM ID</div>
          <div class="value" id="room-id-val">—</div>
        </div>
        <div class="field">
          <label>Share URL</label>
          <div class="share-url" id="share-url">—</div>
        </div>
        <button class="btn btn-danger" id="stop-btn">STOP HOSTING</button>
      </div>
    </div>

    <!-- Log -->
    <div class="panel">
      <div class="panel-header">◈ Event Log</div>
      <div class="panel-body" style="padding:8px">
        <ul id="log"></ul>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const peers = {}; // utiliserId → RTCPeerConnection
let localStream = null;
let roomId = null;
let viewerCount = 0;

// ── UI refs ────────────────────────────────────────────────────────────────
const video       = document.getElementById('local-video');
const overlay     = document.getElementById('video-overlay');
const recBadge    = document.getElementById('rec-badge');
const startBtn    = document.getElementById('start-btn');
const stopBtn     = document.getElementById('stop-btn');
const camSel      = document.getElementById('cam-select');
const qualSel     = document.getElementById('quality-select');
const roomInput   = document.getElementById('room-input');
const roomInfoPnl = document.getElementById('room-info-panel');
const roomIdVal   = document.getElementById('room-id-val');
const shareUrl    = document.getElementById('share-url');
const logEl       = document.getElementById('log');
const viewerBadges= document.getElementById('viewer-badges');

function log(msg, type = '') {
  const li = document.createElement('li');
  li.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  li.className = type;
  logEl.prepend(li);
  if (logEl.children.length > 50) logEl.lastChild.remove();
}

function setStatus(s, color) {
  const el = document.getElementById('stat-status');
  el.textContent = s;
  if (color) el.style.color = `var(--${color})`;
}

// ── Enumerate cameras ──────────────────────────────────────────────────────
async function loadCameras() {
  try {
    await navigator.mediaDevices.getUserMedia({ video: true });
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    camSel.innerHTML = cams.map((c, i) =>
      `<option value="${c.deviceId}">${c.label || `Camera ${i+1}`}</option>`
    ).join('');
    log(`Found ${cams.length} camera(s)`, 'ok');
  } catch (e) {
    if (!window.isSecureContext) {
      log('Camera blocked: HTTPS is required on LAN.', 'err');
      camSel.innerHTML = '<option value="">HTTPS Required</option>';
    } else {
      log(`Camera error: ${e.message || e.name}`, 'err');
      camSel.innerHTML = '<option value="">Permission denied</option>';
    }
  }
}
loadCameras();

// ── Auto room name ─────────────────────────────────────────────────────────
roomInput.value = `cam-${Math.random().toString(36).slice(2,7)}`;

// ── Start hosting ──────────────────────────────────────────────────────────
startBtn.addEventListener('click', async () => {
  const deviceId = camSel.value;
  if (!deviceId) { log('No camera selected', 'err'); return; }

  const [w, h] = qualSel.value.split('x').map(Number);
  setStatus('STARTING', 'amber');
  log('Requesting camera...');

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: deviceId }, width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: 30 } },
      audio: false,
    });

    video.srcObject = localStream;
    overlay.classList.add('hidden');
    recBadge.classList.add('active');

    const track = localStream.getVideoTracks()[0];
    const settings = track.getSettings();
    document.getElementById('stat-res').textContent = `${settings.width}×${settings.height}`;
    document.getElementById('stat-fps').textContent = `${settings.frameRate || 30} fps`;

    // Join room
    roomId = roomInput.value.trim() || `cam-${Date.now()}`;
    socket.emit('host:join', { roomId });
    log(`Joining room "${roomId}"...`);
  } catch (e) {
    log(`Camera error: ${e.message}`, 'err');
    setStatus('ERROR', 'red');
  }
});

// ── Stop hosting ───────────────────────────────────────────────────────────
stopBtn.addEventListener('click', () => {
  cleanup();
  location.reload();
});

function cleanup() {
  localStream?.getTracks().forEach(t => t.stop());
  Object.values(peers).forEach(p => p.close());
  localStream = null;
  roomId = null;
}

// ── Socket events ──────────────────────────────────────────────────────────
socket.on('host:ready', ({ roomId: rid }) => {
  log(`Room "${rid}" live!`, 'ok');
  setStatus('LIVE', 'green');
  document.getElementById('stat-room').textContent = rid;
  roomIdVal.textContent = rid;
  const url = `${location.origin}/utiliser.html?room=${encodeURIComponent(rid)}`;
  shareUrl.textContent = url;
  startBtn.closest('.panel').style.display = 'none';
  roomInfoPnl.style.display = 'block';
});

socket.on('utiliser:request', async ({ utiliserId }) => {
  log(`New viewer: ${utiliserId.slice(0,8)}`, 'ok');
  viewerCount++;
  updateViewerCount();
  addViewerBadge(utiliserId);

  const pc = createPeer(utiliserId);
  peers[utiliserId] = pc;

  // Add tracks
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  // Create offer
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  socket.emit('rtc:offer', { to: utiliserId, offer });
});

socket.on('rtc:answer', async ({ from, answer }) => {
  const pc = peers[from];
  if (!pc) return;
  await pc.setRemoteDescription(answer);
  log(`WebRTC connected to ${from.slice(0,8)}`, 'ok');
});

socket.on('rtc:ice', async ({ from, candidate }) => {
  try { await peers[from]?.addIceCandidate(candidate); } catch {}
});

socket.on('utiliser:left', ({ utiliserId }) => {
  log(`Viewer left: ${utiliserId.slice(0,8)}`, 'warn');
  peers[utiliserId]?.close();
  delete peers[utiliserId];
  viewerCount = Math.max(0, viewerCount - 1);
  updateViewerCount();
  removeViewerBadge(utiliserId);
});

socket.on('error', ({ message }) => log(message, 'err'));

// ── WebRTC helpers ─────────────────────────────────────────────────────────
function createPeer(peerId) {
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ],
  });

  pc.onicecandidate = ({ candidate }) => {
    if (candidate) socket.emit('rtc:ice', { to: peerId, candidate });
  };

  pc.onconnectionstatechange = () => {
    log(`Peer ${peerId.slice(0,8)}: ${pc.connectionState}`);
  };

  return pc;
}

function updateViewerCount() {
  document.getElementById('viewer-count').textContent = viewerCount;
}

function addViewerBadge(id) {
  const div = document.createElement('div');
  div.className = 'viewer-badge';
  div.id = `vb-${id}`;
  div.textContent = `VIEWER ${id.slice(0,6)}`;
  viewerBadges.appendChild(div);
}

function removeViewerBadge(id) {
  document.getElementById(`vb-${id}`)?.remove();
}

window.addEventListener('beforeunload', cleanup);
</script>
</body>
</html>
